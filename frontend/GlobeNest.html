<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeNest — Plan trips that feel like yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy-950:#071b26;
  --navy-900:#0b2635;
  --navy-800:#0f3549;
  --ocean-700:#124a63;
  --ocean-600:#17667f;
  --teal-600:#1c8a8e;
  --teal-500:#2ba7a8;
  --teal-400:#4fc0bd;
  --teal-300:#8adcd4;
  --teal-100:#d9f2ee;
  --mist-50:#f6faf9;
  --mist-100:#eef6f4;
  --coral-500:#ff8a5c;
  --coral-600:#f06f3f;
  --ink:#0c2530;
  --ink-soft:#4d6870;
  --ink-faint:#8aa0a3;
  --line:#dde9e6;
  --line-soft:#eaf2f0;
  --white:#ffffff;
  --danger:#e2564a;
  --danger-bg:#fdeeec;
  --success:#289e66;
  --success-bg:#e9f7ef;
  --warning:#c98a1f;
  --warning-bg:#fbf1de;
  --radius-lg:22px;
  --radius-md:15px;
  --radius-sm:10px;
  --shadow-sm: 0 1px 3px rgba(9,32,42,.06), 0 1px 2px rgba(9,32,42,.05);
  --shadow-md: 0 8px 24px rgba(9,32,42,.10);
  --shadow-lg: 0 24px 56px rgba(9,32,42,.18);
  --font-display:'Plus Jakarta Sans', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-display);
  background:var(--mist-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;object-fit:cover;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--teal-300);color:var(--navy-950);}
:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

.mono{font-family:var(--font-mono);letter-spacing:.02em;}
.hidden{display:none !important;}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:12px;border:1px solid transparent;
  font-weight:600;font-size:14.5px;transition:all .18s ease;
  white-space:nowrap;line-height:1.2;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy-900);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--navy-950);box-shadow:var(--shadow-md);}
.btn-accent{background:var(--teal-500);color:#fff;}
.btn-accent:hover{background:var(--teal-600);box-shadow:var(--shadow-md);}
.btn-coral{background:var(--coral-500);color:#fff;}
.btn-coral:hover{background:var(--coral-600);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--mist-100);border-color:var(--ink-faint);}
.btn-soft{background:var(--teal-100);color:var(--ocean-700);}
.btn-soft:hover{background:var(--teal-300);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px;}
.btn-lg{padding:14px 26px;font-size:15.5px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{padding:9px;border-radius:10px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ============ INPUTS ============ */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.input, select.input, textarea.input{
  width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
  font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;
  transition:border-color .15s, box-shadow .15s;
}
.input:focus{border-color:var(--teal-500);box-shadow:0 0 0 3px var(--teal-100);}
.input-wrap{position:relative;}
.input-wrap .input{padding-right:42px;}
.input-icon-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-faint);padding:6px;}
.input-icon-btn:hover{color:var(--ink);}
.hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
.error-text{font-size:12px;color:var(--danger);margin-top:5px;display:none;}
.field.has-error .input{border-color:var(--danger);}
.field.has-error .error-text{display:block;}
.checkbox-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-soft);}
.checkbox-row input{width:16px;height:16px;accent-color:var(--teal-500);}

/* ============ CHIPS / TAGS ============ */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;
  font-size:13px;font-weight:600;background:var(--mist-100);color:var(--ink-soft);
  border:1.5px solid transparent;cursor:pointer;transition:all .15s;user-select:none;
}
.chip:hover{border-color:var(--teal-300);}
.chip.active{background:var(--navy-900);color:#fff;}
.chip-static{cursor:default;}
.chip-static:hover{border-color:transparent;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.badge-teal{background:var(--teal-100);color:var(--ocean-700);}
.badge-coral{background:#ffe9de;color:var(--coral-600);}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warn{background:var(--warning-bg);color:var(--warning);}
.badge-navy{background:var(--navy-900);color:#fff;}

/* ============ CARDS ============ */
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line-soft);}
.card-hover{transition:transform .2s ease, box-shadow .2s ease;}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}

/* ============ APP LAYOUT ============ */
#app{min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--navy-950);color:#e7f2f0;
  display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:8px 10px 26px;}
.sidebar-logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal-400),var(--ocean-600));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;}
.sidebar-logo .word{font-weight:800;font-size:18px;letter-spacing:-.01em;}
.sidebar-cta{margin:4px 0 18px;}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  color:#a9c2c0;font-size:14px;font-weight:600;transition:all .15s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(79,192,189,.16);color:var(--teal-300);}
.nav-item svg{flex-shrink:0;}
.sidebar-divider{height:1px;background:rgba(255,255,255,.08);margin:14px 0;}
.sidebar-foot{margin-top:auto;padding-top:14px;}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--coral-500),var(--teal-500));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.sidebar-user .u-name{font-size:13px;font-weight:700;color:#fff;}
.sidebar-user .u-role{font-size:11px;color:#8fb0ad;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(246,250,249,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:14px 32px;display:flex;align-items:center;gap:16px;
}
.topbar .search-wrap{flex:1;max-width:460px;position:relative;}
.topbar .search-wrap input{padding-left:40px;background:#fff;}
.topbar .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.icon-btn{position:relative;width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .15s;}
.icon-btn:hover{border-color:var(--teal-400);color:var(--teal-600);}
.dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--coral-500);border:2px solid #fff;}

.page{padding:28px 32px 60px;max-width:1320px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
.page-head h1{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;}
.page-head p{margin:0;color:var(--ink-soft);font-size:14.5px;}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-600);margin-bottom:8px;display:block;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:34px 0 16px;}
.section-head h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;}
.section-head .link{font-size:13px;font-weight:700;color:var(--ocean-600);}

.grid{display:grid;gap:20px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.hscroll{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{height:6px;}
.hscroll > *{scroll-snap-align:start;flex-shrink:0;}

/* ============ TICKET / BOARDING-PASS TRIP CARD (signature element) ============ */
.ticket{
  position:relative;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);
  border:1px solid var(--line-soft);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .2s ease, box-shadow .2s ease;
}
.ticket:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.ticket-cover{position:relative;height:150px;overflow:hidden;}
.ticket-cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.ticket:hover .ticket-cover img{transform:scale(1.06);}
.ticket-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,27,38,0) 40%,rgba(7,27,38,.55) 100%);}
.ticket-status{position:absolute;top:12px;left:12px;}
.ticket-cover .ticket-title{position:absolute;bottom:12px;left:16px;right:16px;color:#fff;font-weight:800;font-size:16.5px;letter-spacing:-.01em;}
.ticket-body{padding:14px 16px 16px;}
.ticket-route{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);}
.ticket-route .city-code{font-size:22px;font-weight:700;color:var(--navy-900);}
.ticket-route .city-code small{display:block;font-size:9.5px;color:var(--ink-faint);font-weight:600;letter-spacing:.06em;margin-top:1px;}
.ticket-route .plane{color:var(--teal-500);flex:1;text-align:center;padding:0 8px;}
.perf{position:relative;height:1px;margin:12px -16px;border-top:2px dashed var(--line);}
.perf::before,.perf::after{content:'';position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--mist-50);}
.perf::before{left:-8px;}
.perf::after{right:-8px;}
.ticket-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.ticket-meta .mono{color:var(--ink);font-weight:600;}
.ticket-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.progress-mini{flex:1;height:5px;border-radius:6px;background:var(--line-soft);overflow:hidden;margin-right:10px;}
.progress-mini > div{height:100%;background:linear-gradient(90deg,var(--teal-400),var(--teal-600));border-radius:6px;}

/* ============ DESTINATION / ACTIVITY CARD ============ */
.dest-card{width:230px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--line-soft);}
.dest-card .img-wrap{height:140px;position:relative;overflow:hidden;}
.dest-card img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
.dest-card:hover img{transform:scale(1.08);}
.dest-card .save-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--navy-900);border:none;}
.dest-card .save-btn.saved{color:var(--coral-500);}
.dest-card .body{padding:13px 14px 15px;}
.dest-card h4{margin:0 0 3px;font-size:15px;font-weight:800;}
.dest-card .country{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
.dest-card .row{display:flex;align-items:center;justify-content:space-between;}

.act-card{background:#fff;border-radius:16px;border:1px solid var(--line-soft);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;}
.act-card .img-wrap{height:120px;}
.act-card .img-wrap img{width:100%;height:100%;object-fit:cover;}
.act-card .body{padding:13px;flex:1;display:flex;flex-direction:column;gap:8px;}

/* ============ BUDGET CARD / STAT CARD ============ */
.stat-card{padding:20px;display:flex;flex-direction:column;gap:6px;}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.stat-card .value{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.stat-card .delta{font-size:12px;font-weight:700;}
.stat-card .delta.up{color:var(--success);}
.stat-card .delta.down{color:var(--danger);}

/* ============ TABS ============ */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;}
.tab{padding:10px 6px;margin-right:18px;font-size:14px;font-weight:700;color:var(--ink-faint);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab.active{color:var(--navy-950);border-color:var(--teal-500);}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(7,20,27,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:popIn .2s cubic-bezier(.2,.9,.3,1.2);}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;}
.modal-head h3{margin:0;font-size:18px;font-weight:800;}
.modal-body{padding:18px 22px 22px;}
.modal-close{width:30px;height:30px;border-radius:9px;border:none;background:var(--mist-100);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}

/* ============ TOASTS ============ */
#toast-stack{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy-950);color:#fff;padding:13px 18px;border-radius:13px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);min-width:240px;}
.toast.success{background:#1a5c3f;}
.toast.error{background:#7a2a24;}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.leaving{animation:toastOut .2s forwards;}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* ============ EMPTY / SKELETON ============ */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .icon-wrap{width:64px;height:64px;border-radius:18px;background:var(--teal-100);color:var(--teal-600);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.empty-state h3{margin:0 0 6px;font-size:17px;color:var(--ink);font-weight:800;}
.empty-state p{margin:0 0 18px;font-size:13.5px;max-width:320px;}
.skel{background:linear-gradient(90deg,var(--line-soft) 25%,#f4f9f8 37%,var(--line-soft) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:12px;}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============ LOGIN / REGISTER ============ */
.auth-shell{min-height:100vh;display:flex;}
.auth-visual{flex:1.1;position:relative;background:linear-gradient(160deg,var(--navy-950),var(--ocean-700) 70%);display:flex;flex-direction:column;justify-content:space-between;padding:44px;color:#fff;overflow:hidden;}
.auth-visual::before{content:'';position:absolute;inset:0;background-image:url('https://picsum.photos/seed/globenest-hero/1200/1400');background-size:cover;background-position:center;opacity:.32;mix-blend-mode:luminosity;}
.auth-visual .content{position:relative;z-index:1;}
.auth-visual .quote{font-size:26px;font-weight:700;line-height:1.35;max-width:420px;letter-spacing:-.01em;}
.auth-visual .quote-meta{margin-top:16px;font-size:13px;color:var(--teal-200,#bfe6e2);font-family:var(--font-mono);}
.auth-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--mist-50);}
.auth-card{width:100%;max-width:400px;}
.auth-tabs{display:flex;background:var(--mist-100);border-radius:12px;padding:4px;margin-bottom:26px;}
.auth-tabs button{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-soft);}
.auth-tabs button.active{background:#fff;color:var(--navy-950);box-shadow:var(--shadow-sm);}

/* ============ WIZARD (create trip) ============ */
.wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:32px;}
.wz-step{display:flex;align-items:center;gap:9px;color:var(--ink-faint);}
.wz-num{width:30px;height:30px;border-radius:50%;background:var(--mist-100);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:var(--font-mono);flex-shrink:0;transition:all .2s;}
.wz-step.active .wz-num{background:var(--navy-950);color:#fff;}
.wz-step.done .wz-num{background:var(--teal-500);color:#fff;}
.wz-step.active .wz-label{color:var(--navy-950);}
.wz-step.done .wz-label{color:var(--ink-soft);}
.wz-label{font-weight:700;font-size:13.5px;white-space:nowrap;}
.wz-line{flex:1;height:2px;background:var(--line);margin:0 12px;min-width:20px;}
.wz-line.done{background:var(--teal-500);}

/* ============ ITINERARY BUILDER ============ */
.city-block{background:#fff;border-radius:18px;border:1px solid var(--line-soft);box-shadow:var(--shadow-sm);margin-bottom:0;overflow:hidden;}
.city-block-head{display:flex;gap:14px;padding:16px;cursor:grab;}
.city-block-head img{width:76px;height:76px;border-radius:13px;object-fit:cover;flex-shrink:0;}
.timeline-connector{display:flex;align-items:center;gap:10px;padding:8px 0 8px 38px;color:var(--ink-faint);font-size:12px;font-weight:600;}
.timeline-connector .line{width:2px;height:22px;background:var(--line);margin-left:20px;}
.activity-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);}
.activity-row .time{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--ocean-600);width:58px;flex-shrink:0;}
.activity-row .grip{cursor:grab;color:var(--ink-faint);}
.dragging{opacity:.4;}
.drop-hint{height:3px;background:var(--teal-400);border-radius:3px;margin:2px 16px;}

/* ============ CALENDAR ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-daylabel{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.cal-cell{background:#fff;border:1px solid var(--line-soft);border-radius:12px;min-height:104px;padding:8px;font-size:11px;}

function fmtMoney(n){return '₹' + Math.round(n).toLocaleString('en-IN');}
function fmtDate(d){const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtDateFull(d){const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function daysBetween(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000));}
function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9);}
function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}
function initials(name){return name.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();}
function cityCode(name){
  const map={Ahmedabad:'AMD',Mumbai:'BOM',Delhi:'DEL',Jaipur:'JAI',Udaipur:'UDR',Goa:'GOI',Dubai:'DXB',Paris:'PAR',London:'LON',Tokyo:'TYO',Bali:'DPS',Singapore:'SIN'};

}

/* ---------- TOASTS ---------- */
function toast(msg, type='default'){
  const stack = document.getElementById('toast-stack');
  const id = 't'+(STATE.toastId++);
  const el = document.createElement('div');
  el.className = 'toast'+(type!=='default'?' '+type:'');
  el.id = id;
  el.innerHTML = `${type==='success'?icon('check'):type==='error'?icon('warn'):''}<span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(),200);
  }, 2800);

/* ---------- MAIN RENDER DISPATCH ---------- */
function render(){
  const app = document.getElementById('app');
  const r = STATE.route || '#/login';
  window.scrollTo(0,0);

  if(!STATE.authed && !r.startsWith('#/trip/public')){
    if(r.startsWith('#/register')) { app.innerHTML = renderRegister(); return; }
    app.innerHTML = renderLogin();
    return;
  }

  if(r.startsWith('#/dashboard')) app.innerHTML = shell(renderDashboard());
  else if(r === '#/trips' || r.startsWith('#/trips?')) app.innerHTML = shell(renderMyTrips());
  else if(r.startsWith('#/trip/new')) app.innerHTML = shell(renderWizard());
  else if(r.startsWith('#/trip/public/')) app.innerHTML = renderPublicTrip(r.split('/').pop());
  else if(r.match(/^#\/trip\/[\w]+\/itinerary/)) app.innerHTML = shell(renderItinerary(r.split('/')[2]));
  else if(r.match(/^#\/trip\/[\w]+\/budget/)) app.innerHTML = shell(renderBudget(r.split('/')[2]));
  else if(r.match(/^#\/trip\/[\w]+\/calendar/)) app.innerHTML = shell(renderTripCalendar(r.split('/')[2]));
  else if(r.startsWith('#/explore')) app.innerHTML = shell(renderExplore());
  else if(r.startsWith('#/calendar')) app.innerHTML = shell(renderCalendar());
  else if(r.startsWith('#/community')) app.innerHTML = shell(renderCommunity());
  else if(r.startsWith('#/profile')) app.innerHTML = shell(renderProfile());
  else if(r.startsWith('#/admin')) app.innerHTML = shell(renderAdmin());
  else app.innerHTML = shell(renderDashboard());
}

function togglePw(id,btn){

function updatePwStrength(v){
  let score=0;
  if(v.length>=8) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  if(/[A-Z]/.test(v)) score++;
  const pct = [10,35,60,85,100][score];
  const colors = ['#e2564a','#e2564a','#c98a1f','#289e66','#289e66'];
  const bar = document.getElementById('pw-strength-bar');
  if(bar){ bar.style.width = pct+'%'; bar.style.background = colors[score]; }
  const txt = document.getElementById('pw-strength-text');
  if(txt){ txt.textContent = ['Too short','Weak password','Okay password','Good password','Strong password'][score]; }
}

function statusBadge(status){
  const map = {upcoming:['badge-teal','Upcoming'], ongoing:['badge-coral','Ongoing'], completed:['badge-navy','Completed'], draft:['badge-warn','Draft']};
  const [cls,label] = map[status]||map.upcoming;
  return `<span class="badge ${cls}">${label}</span>`;
}
function tripSpend(trip){
  let sum=0; trip.cities.forEach(c=>c.activities.forEach(a=>sum+=a.cost));
  const accCost = trip.cities.length * 3200 * Math.max(1,daysBetween(trip.startDate,trip.endDate)/trip.cities.length/3);
  return Math.round(sum + accCost*0.4);
}
function tripProgress(trip){
  const fields = [trip.name!=='Untitled trip', trip.cities.length>0, trip.cities.some(c=>c.activities.length>0), trip.budgetTotal>0];
  return Math.round(fields.filter(Boolean).length/fields.length*100);
}

  let list = STATE.trips;
  if(myTripsTab==='Upcoming') list = list.filter(t=>t.status==='upcoming');
  else if(myTripsTab==='Ongoing') list = list.filter(t=>t.status==='ongoing');
  else if(myTripsTab==='Completed') list = list.filter(t=>t.status==='completed');
  else if(myTripsTab==='Drafts') list = list.filter(t=>t.status==='draft');

  return `
  <div class="page">
    <div class="page-head">
      <div><span class="eyebrow">Your itineraries</span><h1>My Trips</h1><p>${STATE.trips.length} trip${STATE.trips.length===1?'':'s'} in your account.</p></div>
      <button class="btn btn-primary btn-lg" onclick="startWizard()">${icon('plus')} Plan New Trip</button>
    </div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${myTripsTab===t?'active':''}" onclick="setMyTripsTab('${t}')">${t}</div>`).join('')}</div>
    ${list.length? `<div class="grid grid-3">${list.map(t=>tripManageCardHtml(t)).join('')}</div>` :
      `<div class="empty-state card"><div class="icon-wrap">${icon('trips')}</div><h3>No trips here yet</h3><p>Trips you create will show up in this tab once they match its status.</p><button class="btn btn-primary" onclick="startWizard()">${icon('plus')} Plan New Trip</button></div>`}
  </div>`;
}
function tripManageCardHtml(trip){
  return `
  <div class="ticket">
    <div class="ticket-cover" onclick="openTrip('${trip.id}')" style="cursor:pointer">
      <img src="${trip.cover}"><div class="ticket-status">${statusBadge(trip.status)}</div><div class="ticket-title">${trip.name}</div>
    </div>
    <div class="ticket-body">
      <div class="ticket-meta"><span>${trip.cities.length} ${trip.cities.length===1?'city':'cities'}</span><span class="mono">${fmtDate(trip.startDate)} – ${fmtDate(trip.endDate)}</span></div>
      <div class="ticket-meta"><span>Budget</span><span class="mono" style="font-weight:700">${fmtMoney(trip.budgetTotal)}</span></div>
      <div class="perf"></div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <button class="btn btn-soft btn-sm" onclick="openTrip('${trip.id}')">${icon('edit')} Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="duplicateTrip('${trip.id}')">${icon('copy')} Duplicate</button>
        <button class="btn btn-ghost btn-sm" onclick="shareTrip('${trip.id}')">${icon('share')} Share</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteTrip('${trip.id}')">${icon('trash')}</button>
      </div>
    </div>
  </div>`;
}
function duplicateTrip(id){
  const t = STATE.trips.find(x=>x.id===id);
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = uid('trip'); copy.name = t.name + ' (Copy)'; copy.status='draft'; copy.isPublic=false;
  STATE.trips.unshift(copy);
  toast('Trip duplicated to Drafts.','success');
  render();
}
function shareTrip(id){
  const t = STATE.trips.find(x=>x.id===id);
  t.isPublic = true;
  openModal('Share trip', `
    <p class="text-sm text-mute" style="margin-top:0">Anyone with this link can view a read-only copy of <b>${t.name}</b>.</p>
    <div class="flex gap-8" style="margin:14px 0;">
      <input class="input" readonly value="globenest.app/trip/public/${t.id}" style="font-family:var(--font-mono);font-size:12.5px">
      <button class="btn btn-primary" onclick="toast('Link copied to clipboard.','success');closeModal()">${icon('copy')} Copy</button>
    </div>
    <button class="btn btn-ghost btn-block" onclick="closeModal();nav('#/trip/public/${t.id}')">${icon('eye')} Preview public page</button>
  `, {width:440});
  render();
}
function confirmDeleteTrip(id){
  const t = STATE.trips.find(x=>x.id===id);
  openModal('Delete this trip?', `
    <p class="text-sm text-mute" style="margin-top:0">This will permanently remove <b>${t.name}</b> and its itinerary. This can't be undone.</p>
    <div class="flex gap-10" style="margin-top:18px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteTrip('${id}')">${icon('trash')} Delete trip</button>
    </div>
  `, {width:420});
}
function deleteTrip(id){
  STATE.trips = STATE.trips.filter(t=>t.id!==id);
  closeModal();
  toast('Trip deleted.','success');
  render();
}

/* ================= CREATE TRIP WIZARD ================= */
const WIZARD_STEPS = ['Trip Details','Destinations','Preferences','Budget','Review'];
function startWizard(){
  STATE.wizard = { step:0, name:'', description:'', cover: img('new-trip-'+Date.now(),800,500),
    startDate: addDays(new Date(),30), endDate: addDays(new Date(),35), destIds:[], interests:[], budgetTotal: 40000 };
  nav('#/trip/new');
}
function wizardGoto(step){
  if(step > STATE.wizard.step && !wizardValidateStep(STATE.wizard.step)) return;
  STATE.wizard.step = step; render();
}
function wizardValidateStep(step){
  const w = STATE.wizard;
  if(step===0){
    if(!w.name.trim()){ toast('Give your trip a name first.','error'); return false; }
    if(new Date(w.endDate) <= new Date(w.startDate)){ toast('End date must be after the start date.','error'); return false; }
  }
  if(step===1 && w.destIds.length===0){ toast('Pick at least one destination.','error'); return false; }
  return true;
}
function wizardNext(){
  if(!wizardValidateStep(STATE.wizard.step)) return;
  if(STATE.wizard.step < WIZARD_STEPS.length-1){ STATE.wizard.step++; render(); }
  else finalizeWizard();
}
function wizardBack(){ if(STATE.wizard.step>0){ STATE.wizard.step--; render(); } }
function wizardSaveDraft(){
  toast('Draft saved to My Trips.','success');
  buildTripFromWizard('draft');
  nav('#/trips');
}
function wizardToggleDest(id){
  const w = STATE.wizard;
  const i = w.destIds.indexOf(id);
  if(i>-1) w.destIds.splice(i,1); else w.destIds.push(id);
  render();
}
function wizardToggleInterest(tag){
  const w = STATE.wizard;
  const i = w.interests.indexOf(tag);
  if(i>-1) w.interests.splice(i,1); else w.interests.push(tag);
  render();
}
function buildTripFromWizard(status){
  const w = STATE.wizard;
  const totalDays = daysBetween(w.startDate, w.endDate);
  const perCity = Math.max(2, Math.floor(totalDays / w.destIds.length));
  let cursor = w.startDate;
  const cities = w.destIds.map((id,i)=>{
    const dep = i===w.destIds.length-1 ? w.endDate : addDays(cursor, perCity);
    const stop = sampleCityStop(id, cursor, dep, 3);
    cursor = dep;
    return stop;
  });
  const trip = makeTrip({ name:w.name, description:w.description, cover:w.cover, startDate:w.startDate, endDate:w.endDate,
    status: status||'upcoming', budgetTotal:w.budgetTotal, interests:w.interests, cities });
  STATE.trips.unshift(trip);
  return trip;
}
function finalizeWizard(){
  const trip = buildTripFromWizard('upcoming');
  toast('Trip created — let\'s build the itinerary!','success');
  STATE.activeTripId = trip.id;
  STATE.wizard = null;
  nav('#/trip/'+trip.id+'/itinerary');
}

function renderWizard(){
  const w = STATE.wizard;
  if(!w){ return `<div class="page"><div class="empty-state card"><h3>No trip in progress</h3><button class="btn btn-primary" onclick="startWizard()">Start planning</button></div></div>`; }
  return `
  <div class="page" style="max-width:820px">
    <div class="page-head"><div><span class="eyebrow">New trip</span><h1>Plan your trip</h1></div></div>
    <div class="wizard-steps">
      ${WIZARD_STEPS.map((s,i)=>`
        <div class="wz-step ${i===w.step?'active':i<w.step?'done':''}" style="cursor:pointer" onclick="wizardGoto(${i})">
          <div class="wz-num">${i<w.step?icon('check'):i+1}</div><div class="wz-label">${s}</div>
        </div>
        ${i<WIZARD_STEPS.length-1?`<div class="wz-line ${i<w.step?'done':''}"></div>`:''}
      `).join('')}
    </div>
    <div class="card" style="padding:28px;">
      ${w.step===0?wizardStep0():w.step===1?wizardStep1():w.step===2?wizardStep2():w.step===3?wizardStep3():wizardStep4()}
    </div>
    <div class="flex justify-between" style="margin-top:20px;">
      <div>${w.step>0?`<button class="btn btn-ghost" onclick="wizardBack()">${icon('chevLeft')} Back</button>`:''}</div>
      <div class="flex gap-10">
        <button class="btn btn-ghost" onclick="wizardSaveDraft()">Save Draft</button>
        <button class="btn btn-primary" onclick="wizardNext()">${w.step===WIZARD_STEPS.length-1?'Create Trip':'Continue'} ${w.step<WIZARD_STEPS.length-1?icon('chevRight'):''}</button>
      </div>
    </div>
  </div>`;
}
function wizardStep0(){
  const w = STATE.wizard;
  return `
    <h3 style="margin-top:0">Trip details</h3>
    <div class="field"><label>Trip name</label><input class="input" value="${w.name}" placeholder="e.g. Rajasthan in Ten Days" oninput="STATE.wizard.name=this.value">
    </div>
    <div class="field"><label>Description</label><textarea class="input" rows="3" placeholder="What's this trip about?" oninput="STATE.wizard.description=this.value">${w.description}</textarea></div>
    <div class="field"><label>Cover image</label>
      <div class="flex gap-12 items-center">
        <img src="${w.cover}" style="width:90px;height:60px;border-radius:10px;object-fit:cover">
        <button class="btn btn-ghost btn-sm" onclick="STATE.wizard.cover=img('cover-'+Date.now(),800,500);render()">Shuffle image</button>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Start date</label><input class="input" type="date" value="${w.startDate}" onchange="STATE.wizard.startDate=this.value"></div>
      <div class="field"><label>End date</label><input class="input" type="date" value="${w.endDate}" onchange="STATE.wizard.endDate=this.value"></div>
    </div>`;
}
function wizardStep1(){
  const w = STATE.wizard;
  return `
    <h3 style="margin-top:0">Choose destinations</h3>
    <p class="text-sm text-mute" style="margin-top:-8px">Pick as many cities as you'd like to visit. Selected: <b>${w.destIds.length}</b></p>
    <div class="grid grid-3">
      ${DESTINATIONS.map(d=>{
        const sel = w.destIds.includes(d.id);
        return `<div class="card ${sel?'':''}" style="padding:0;overflow:hidden;cursor:pointer;border:2px solid ${sel?'var(--teal-500)':'var(--line-soft)'}" onclick="wizardToggleDest('${d.id}')">
          <div style="position:relative"><img src="${img(d.id+'-wz',300,150)}" style="height:90px;width:100%;object-fit:cover">
            ${sel?`<div style="position:absolute;top:8px;right:8px;background:var(--teal-500);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center">${icon('check')}</div>`:''}
          </div>
          <div style="padding:10px 12px"><div style="font-weight:800;font-size:13.5px">${d.city}</div><div class="text-sm text-mute">${d.country}</div></div>
        </div>`;
      }).join('')}
    </div>`;
}
function wizardStep2(){
  const w = STATE.wizard;
  const prefs = ['Adventure','Food','Culture','Nature','Beaches','History','Shopping','Luxury','Budget travel'];
  return `
    <h3 style="margin-top:0">Select your interests</h3>
    <p class="text-sm text-mute" style="margin-top:-8px">We'll use these to recommend activities for your itinerary.</p>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">
      ${prefs.map(p=>`<span class="chip ${w.interests.includes(p)?'active':''}" onclick="wizardToggleInterest('${p}')">${p}</span>`).join('')}
    </div>`;
}
function wizardStep3(){
  const w = STATE.wizard;
  const days = daysBetween(w.startDate,w.endDate);
  return `
    <h3 style="margin-top:0">Set your budget</h3>
    <div class="field"><label>Total trip budget (₹)</label>
      <input class="input" type="range" min="10000" max="200000" step="1000" value="${w.budgetTotal}" oninput="STATE.wizard.budgetTotal=Number(this.value);document.getElementById('wz-budget-val').textContent=fmtMoney(this.value)">
      <div class="flex justify-between" style="margin-top:8px"><span class="text-sm text-mute">₹10,000</span><span class="mono" id="wz-budget-val" style="font-weight:800;font-size:18px">${fmtMoney(w.budgetTotal)}</span><span class="text-sm text-mute">₹2,00,000</span></div>
    </div>
    <div class="grid grid-3" style="margin-top:18px">
      <div class="card stat-card" style="padding:16px"><div class="label">Per day</div><div class="value" style="font-size:18px">${fmtMoney(w.budgetTotal/Math.max(1,days))}</div></div>
      <div class="card stat-card" style="padding:16px"><div class="label">Per city</div><div class="value" style="font-size:18px">${fmtMoney(w.budgetTotal/Math.max(1,w.destIds.length))}</div></div>
      <div class="card stat-card" style="padding:16px"><div class="label">Trip length</div><div class="value" style="font-size:18px">${days} days</div></div>
    </div>`;
}
function wizardStep4(){
  const w = STATE.wizard;
  return `
    <h3 style="margin-top:0">Review your trip</h3>
    <div class="flex gap-16" style="margin-bottom:18px">
      <img src="${w.cover}" style="width:140px;height:100px;border-radius:14px;object-fit:cover">
      <div>
        <div style="font-weight:800;font-size:19px">${w.name||'Untitled trip'}</div>
        <div class="text-sm text-mute" style="margin:4px 0">${fmtDate(w.startDate)} → ${fmtDate(w.endDate)} · ${daysBetween(w.startDate,w.endDate)} days</div>
        <div class="flex gap-8" style="flex-wrap:wrap">${w.destIds.map(id=>`<span class="badge badge-teal">${DESTINATIONS.find(d=>d.id===id).city}</span>`).join('')}</div>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card" style="padding:16px"><div class="text-sm text-mute" style="margin-bottom:4px">Interests</div><div>${w.interests.length?w.interests.join(', '):'None selected'}</div></div>
      <div class="card" style="padding:16px"><div class="text-sm text-mute" style="margin-bottom:4px">Budget</div><div class="mono" style="font-weight:800">${fmtMoney(w.budgetTotal)}</div></div>
    </div>
    <p class="text-sm text-mute" style="margin-top:16px">Clicking <b>Create Trip</b> will generate a starter itinerary with suggested activities for each city — you can customize everything after.</p>`;

/* ================= ITINERARY BUILDER ================= */
function getTrip(id){ return STATE.trips.find(t=>t.id===id); }
function tripSubnav(trip, active){
  const items = [
    {k:'itinerary', label:'Itinerary', href:`#/trip/${trip.id}/itinerary`},
    {k:'budget', label:'Budget', href:`#/trip/${trip.id}/budget`},
    {k:'calendar', label:'Calendar', href:`#/trip/${trip.id}/calendar`},
  ];
  return `<div class="tabs">${items.map(it=>`<a class="tab ${active===it.k?'active':''}" href="${it.href}">${it.label}</a>`).join('')}</div>`;
}
function tripHeader(trip){
  return `
  <div class="page-head">
    <div>
      <span class="eyebrow">${trip.cities.length} ${trip.cities.length===1?'city':'cities'} · ${daysBetween(trip.startDate,trip.endDate)} days</span>
      <h1>${trip.name}</h1>
      <p class="mono">${fmtDateFull(trip.startDate)} → ${fmtDateFull(trip.endDate)} · Budget ${fmtMoney(trip.budgetTotal)}</p>
    </div>
    <div class="flex gap-10">
      <button class="btn btn-ghost" onclick="shareTrip('${trip.id}')">${icon('share')} Share</button>
      <a class="btn btn-ghost" href="#/trips">${icon('trips')} All trips</a>
    </div>
  </div>`;
}

function renderItinerary(tripId){
  const trip = getTrip(tripId);
  if(!trip) return `<div class="page"><div class="empty-state card"><h3>Trip not found</h3></div></div>`;
  return `
  <div class="page">
    ${tripHeader(trip)}
    ${tripSubnav(trip,'itinerary')}
    <div id="itinerary-list">
      ${trip.cities.map((c,i)=>cityBlockHtml(trip,c,i)).join(cityConnectorHtml())}
    </div>
    <button class="btn btn-soft btn-block" style="margin-top:${trip.cities.length?'0':'0'};padding:16px" onclick="openAddStopModal('${trip.id}')">${icon('plus')} Add stop</button>
  </div>`;
}
function cityConnectorHtml(){
  return `<div class="timeline-connector">${icon('plane')}<span>Travel</span><div class="line"></div></div>`;
}
function stopCost(city){ return city.activities.reduce((s,a)=>s+a.cost,0) + 3200*daysBetween(city.arrival,city.departure); }

function cityBlockHtml(trip, city, idx){
  return `
  <div class="city-block" draggable="true" ondragstart="cityDragStart(event,${idx})" ondragover="event.preventDefault()" ondrop="cityDrop(event,'${trip.id}',${idx})">
    <div class="city-block-head">
      <span class="grip" style="align-self:center">${icon('grip')}</span>
      <img src="${city.image}" alt="${city.city}">
      <div style="flex:1">
        <div class="flex justify-between items-start">
          <div>
            <div style="font-weight:800;font-size:16px">${city.city} <span class="text-sm text-mute mono">${city.country}</span></div>
            <div class="text-sm text-mute">${daysBetween(city.arrival,city.departure)} days · Est. ${fmtMoney(stopCost(city))}</div>
          </div>
          <button class="icon-btn" style="width:32px;height:32px" onclick="removeStop('${trip.id}',${idx})">${icon('trash')}</button>
        </div>
        <div class="flex gap-16" style="margin-top:8px;flex-wrap:wrap">
          <label class="text-sm text-mute">Arrival <input type="date" class="input" style="padding:5px 8px;font-size:12.5px;width:140px;display:inline-block" value="${city.arrival}" onchange="updateStopDate('${trip.id}',${idx},'arrival',this.value)"></label>
          <label class="text-sm text-mute">Departure <input type="date" class="input" style="padding:5px 8px;font-size:12.5px;width:140px;display:inline-block" value="${city.departure}" onchange="updateStopDate('${trip.id}',${idx},'departure',this.value)"></label>
        </div>
        <div class="flex gap-16" style="margin-top:8px;flex-wrap:wrap">
          <input class="input" style="padding:5px 8px;font-size:12.5px;width:200px" placeholder="Accommodation" value="${city.accommodation||''}" onchange="updateStopField('${trip.id}',${idx},'accommodation',this.value)">
          <input class="input" style="padding:5px 8px;font-size:12.5px;width:200px" placeholder="Transport notes (e.g. train, flight)" value="${city.transportNote||''}" onchange="updateStopField('${trip.id}',${idx},'transportNote',this.value)">
        </div>
      </div>
    </div>
    ${city.activities.map((a,ai)=>activityRowHtml(trip.id, idx, a, ai, city.activities.length)).join('')}
    <div style="padding:12px 16px;border-top:1px solid var(--line-soft)">
      <button class="btn btn-ghost btn-sm" onclick="openAddActivityModal('${trip.id}',${idx})">${icon('plus')} Add activity</button>
    </div>
  </div>`;
}
function activityRowHtml(tripId, cityIdx, a, ai, total){
  return `
  <div class="activity-row">
    <span class="grip">${icon('grip')}</span>
    <input class="input mono time" style="padding:5px 6px;font-size:12px" value="${a.time}" onchange="updateActivity('${tripId}',${cityIdx},'${a.id}','time',this.value)">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13.5px">${a.name}</div>
      <div class="text-sm text-mute">${a.cat} · ${a.dur}h · ${fmtMoney(a.cost)}</div>
    </div>
    <div class="flex gap-6">
      <button class="icon-btn" style="width:28px;height:28px" title="Move up" ${ai===0?'disabled':''} onclick="moveActivity('${tripId}',${cityIdx},${ai},-1)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg></button>
      <button class="icon-btn" style="width:28px;height:28px" title="Move down" ${ai===total-1?'disabled':''} onclick="moveActivity('${tripId}',${cityIdx},${ai},1)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn" style="width:28px;height:28px" onclick="removeActivity('${tripId}',${cityIdx},'${a.id}')">${icon('trash')}</button>
    </div>
  </div>`;
}

let _dragCityIdx = null;
function cityDragStart(e, idx){ _dragCityIdx = idx; e.dataTransfer.effectAllowed='move'; }
function cityDrop(e, tripId, dropIdx){
  e.preventDefault();
  if(_dragCityIdx===null || _dragCityIdx===dropIdx) return;
  const trip = getTrip(tripId);
  const [moved] = trip.cities.splice(_dragCityIdx,1);
  trip.cities.splice(dropIdx,0,moved);
  _dragCityIdx = null;
  toast('Itinerary reordered.','success');
  render();
}
function moveActivity(tripId, cityIdx, ai, dir){
  const acts = getTrip(tripId).cities[cityIdx].activities;
  const target = ai+dir;
  if(target<0 || target>=acts.length) return;
  [acts[ai],acts[target]] = [acts[target],acts[ai]];
  render();
}
function updateStopDate(tripId, idx, field, value){
  getTrip(tripId).cities[idx][field] = value;
  render();
}
function updateStopField(tripId, idx, field, value){
  getTrip(tripId).cities[idx][field] = value;
}
function updateActivity(tripId, cityIdx, actId, field, value){
  const a = getTrip(tripId).cities[cityIdx].activities.find(x=>x.id===actId);
  a[field] = value;
}
function removeStop(tripId, idx){
  const trip = getTrip(tripId);
  trip.cities.splice(idx,1);
  toast('City removed from itinerary.','success');
  render();
}
function removeActivity(tripId, cityIdx, actId){
  const city = getTrip(tripId).cities[cityIdx];
  city.activities = city.activities.filter(a=>a.id!==actId);
  toast('Activity removed.','success');
  render();
}
function openAddStopModal(tripId){
  const trip = getTrip(tripId);
  const used = trip.cities.map(c=>c.destId);
  const options = DESTINATIONS.filter(d=>!used.includes(d.id));
  openModal('Add a stop', `
    <div class="grid grid-2" style="gap:10px;max-height:400px;overflow-y:auto">
      ${options.map(d=>`
        <div class="card card-hover" style="padding:0;overflow:hidden;cursor:pointer" onclick="addStop('${tripId}','${d.id}')">
          <img src="${img(d.id+'-add',260,120)}" style="height:76px;width:100%;object-fit:cover">
          <div style="padding:8px 10px"><div style="font-weight:700;font-size:13px">${d.city}</div><div class="text-sm text-mute">${d.country}</div></div>
        </div>`).join('') || '<p class="text-mute">All destinations already added.</p>'}
    </div>`, {width:520});
}

/* ================= BUDGET ================= */
function computeBudgetBreakdown(trip){
  const cats = {Transportation:0, Accommodation:0, Activities:0, Food:0, Other:0};
  const nights = daysBetween(trip.startDate, trip.endDate);
  cats.Transportation = trip.cities.length * 2600;
  cats.Accommodation = nights * 3100;
  trip.cities.forEach(c=>c.activities.forEach(a=>{
    if(a.cat==='Food') cats.Food += a.cost; else cats.Activities += a.cost;
  }));
  cats.Other = Math.round((cats.Transportation+cats.Accommodation)*0.08);
  return cats;
}
function donutSVG(cats, colors){
  const total = Object.values(cats).reduce((a,b)=>a+b,0)||1;
  let angle = -90;
  const r=70, cx=90, cy=90;
  let paths='';
  Object.entries(cats).forEach(([k,v],i)=>{
    const frac = v/total;
    const sweep = frac*360;
    const large = sweep>180?1:0;
    const x1 = cx + r*Math.cos(angle*Math.PI/180), y1 = cy + r*Math.sin(angle*Math.PI/180);
    const end = angle+sweep;
    const x2 = cx + r*Math.cos(end*Math.PI/180), y2 = cy + r*Math.sin(end*Math.PI/180);
    if(v>0) paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${colors[i%colors.length]}"><title>${k}: ${fmtMoney(v)}</title></path>`;
    angle = end;
  });
  return `<svg width="180" height="180" viewBox="0 0 180 180">${paths}<circle cx="${cx}" cy="${cy}" r="42" fill="#fff"/></svg>`;
}
function barChartSVG(days){
  const max = Math.max(...days.map(d=>d.cost), 1);
  const w=560, h=180, bw = Math.min(46, (w-20)/days.length - 10);
  const bars = days.map((d,i)=>{
    const bh = Math.round(d.cost/max*130);
    const x = 10 + i*((w-20)/days.length);
    const over = d.cost > d.avg*1.4;
    return `<rect x="${x}" y="${150-bh}" width="${bw}" height="${bh}" rx="5" fill="${over?'var(--coral-500)':'var(--teal-400)'}"><title>${d.label}: ${fmtMoney(d.cost)}</title></rect>
    <text x="${x+bw/2}" y="168" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle" font-family="JetBrains Mono">${d.label}</text>`;
  }).join('');
  return `<svg width="100%" height="180" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet">${bars}</svg>`;
}
function renderBudget(tripId){
  const trip = getTrip(tripId);
  if(!trip) return `<div class="page"><div class="empty-state card"><h3>Trip not found</h3></div></div>`;

    ${remaining<0?`
    <div class="card" style="padding:16px 20px;background:var(--danger-bg);border-color:#f4c9c4;margin-bottom:20px;display:flex;align-items:center;gap:12px;">
      ${icon('warn')} <div><b>You're approximately ${fmtMoney(Math.abs(remaining))} over your planned budget.</b><div class="text-sm">Consider trimming an activity or increasing your budget in Step 3 of trip planning.</div></div>
    </div>`:''}

    <div class="grid grid-4">
      <div class="card stat-card"><div class="label">Total budget</div><div class="value">${fmtMoney(trip.budgetTotal)}</div>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px;width:fit-content" onclick="editBudgetTotal('${trip.id}')">${icon('edit')} Edit</button></div>
      <div class="card stat-card"><div class="label">Estimated spend</div><div class="value">${fmtMoney(spent)}</div></div>
      <div class="card stat-card"><div class="label">Remaining</div><div class="value" style="color:${remaining<0?'var(--danger)':'var(--success)'}">${fmtMoney(Math.abs(remaining))}</div><div class="delta ${remaining<0?'down':'up'}">${remaining<0?'over':'under'} plan</div></div>
      <div class="card stat-card"><div class="label">Average daily cost</div><div class="value">${fmtMoney(avgDaily)}</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:24px;align-items:start">
      <div class="card" style="padding:22px">
        <h3 style="margin-top:0">Category breakdown</h3>
        <div class="flex items-center gap-16">
          ${donutSVG(cats,colors)}
          <div style="flex:1">
            ${Object.entries(cats).map(([k,v],i)=>`
              <div class="legend-row justify-between" style="display:flex">
                <span class="flex items-center gap-8"><span class="legend-dot" style="background:${colors[i]}"></span>${k}</span>
                <span class="mono" style="font-weight:700">${fmtMoney(v)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card" style="padding:22px">
        <h3 style="margin-top:0">Daily spending</h3>
        ${barChartSVG(dayData)}
        ${expensiveDays.length? `<div class="text-sm" style="margin-top:10px;color:var(--coral-600)">${icon('warn')} Highlighted days run above your daily average — worth a second look.</div>`:''}
      </div>
    </div>

    <div class="section-head"><h2>Budget progress</h2></div>
    <div class="card" style="padding:20px">
      <div class="progress-mini" style="height:12px;margin:0"><div style="width:${Math.min(100,spent/trip.budgetTotal*100)}%;background:${remaining<0?'var(--danger)':'linear-gradient(90deg,var(--teal-400),var(--teal-600))'}"></div></div>
      <div class="flex justify-between text-sm text-mute" style="margin-top:8px"><span>${fmtMoney(spent)} spent</span><span>${fmtMoney(trip.budgetTotal)} planned</span></div>

}

let tripCalView = 'timeline';
function setTripCalView(v){ tripCalView=v; render(); }
function tripDaysWithEvents(trip){
  const map = {};
  trip.cities.forEach(c=>{
    c.activities.forEach(a=>{
      const day = c.arrival; // simplification: place all city activities across its date span evenly
    });
  });
  // Build a day-by-day structure across the whole trip span, distributing each city's activities across its span
  const days = [];
  let d = trip.startDate;
  while(new Date(d) <= new Date(trip.endDate)){ days.push({date:d, city:null, events:[]}); d = addDays(d,1); }
  trip.cities.forEach(c=>{
    const span = daysBetween(c.arrival,c.departure);
    c.activities.forEach((a,i)=>{
      const offset = i % Math.max(1,span);
      const dayIdx = days.findIndex(x=>x.date===addDays(c.arrival,offset));
      if(dayIdx>-1){ days[dayIdx].city = c.city; days[dayIdx].events.push(a); }
    });
  });
  return days;
}

/* ================= GLOBAL CALENDAR ================= */
function renderCalendar(){
  const monthDate = new Date(); monthDate.setDate(1); monthDate.setMonth(monthDate.getMonth()+STATE.calMonthOffset);
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const label = monthDate.toLocaleDateString('en-IN',{month:'long', year:'numeric'});

  // map date -> events
  const eventsByDate = {};
  STATE.trips.forEach(trip=>{
    trip.cities.forEach(c=>{
      const span = daysBetween(c.arrival,c.departure);
      c.activities.forEach((a,i)=>{
        const date = addDays(c.arrival, i % Math.max(1,span));
        (eventsByDate[date] = eventsByDate[date]||[]).push({...a, trip:trip.name, city:c.city});
      });
    });
  });

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push('<div></div>');
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const evs = eventsByDate[dateStr]||[];
    cells.push(`
      <div class="cal-cell ${evs.length?'has-events':''}">
        <div class="d-num">${day}</div>
        ${evs.slice(0,2).map((e,i)=>`<div class="cal-chip ${i%2?'coral':''}" title="${e.name} — ${e.trip}" onclick='openEventPeek(${JSON.stringify(e).replace(/'/g,"&#39;")})'>${e.time} ${e.name}</div>`).join('')}
        ${evs.length>2?`<div class="text-sm text-mute" style="font-size:10px">+${evs.length-2} more</div>`:''}
      </div>`);
  }

  return `
  <div class="page">
    <div class="page-head"><div><span class="eyebrow">All trips</span><h1>Calendar</h1><p>Every scheduled activity across your trips.</p></div>
      <div class="flex gap-10 items-center">
        <button class="icon-btn" onclick="STATE.calMonthOffset--;render()">${icon('chevLeft')}</button>
        <span style="font-weight:800;min-width:150px;text-align:center">${label}</span>
        <button class="icon-btn" onclick="STATE.calMonthOffset++;render()">${icon('chevRight')}</button>
      </div>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-daylabel">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells.join('')}</div>
  </div>`;
}

      <div class="flex justify-between"><span class="text-mute">Trip</span><b>${e.trip}</b></div>
      <div class="flex justify-between"><span class="text-mute">City</span><b>${e.city}</b></div>

                <button style="background:none;border:none;display:flex;align-items:center;gap:5px;color:${p.liked?'var(--coral-500)':'var(--ink-soft)'}" onclick="toggleLike('${p.id}')">${icon(p.liked?'heartFilled':'heart')} ${p.likes}</button>
                <span class="flex items-center gap-5">${icon('eye')} ${p.views}</span>
              </div>
              <div class="flex gap-6">
                <button class="icon-btn" style="width:30px;height:30px;color:${p.saved?'var(--teal-600)':''}" onclick="toggleSave('${p.id}')">${icon(p.saved?'bookmarkFilled':'bookmark')}</button>
                <button class="icon-btn" style="width:30px;height:30px" onclick="communityShare('${p.id}')">${icon('share')}</button>
              </div>
            </div>
            <div class="flex gap-8" style="margin-top:12px">
              <button class="btn btn-ghost btn-sm" style="flex:1" onclick="viewCommunityItinerary('${p.id}')">View</button>
              <button class="btn btn-soft btn-sm" style="flex:1" onclick="copyCommunityTrip('${p.id}')">${icon('copy')} Copy Trip</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}
function toggleLike(id){ const p = STATE.community.find(x=>x.id===id); p.liked=!p.liked; p.likes += p.liked?1:-1; render(); }
function toggleSave(id){ const p = STATE.community.find(x=>x.id===id); p.saved=!p.saved; toast(p.saved?'Saved to your list.':'Removed from saved.','success'); render(); }
function communityShare(id){ toast('Share link copied to clipboard.','success'); }
function viewCommunityItinerary(id){
  const p = STATE.community.find(x=>x.id===id);
  const d = DESTINATIONS.find(x=>x.id===p.destId);
  openModal(p.title, `
    <img src="${p.cover}" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:14px">
    <p class="text-sm text-mute">${d.desc}</p>
    <div class="grid grid-2" style="margin:14px 0">
      <div class="card" style="padding:12px"><div class="text-sm text-mute">Duration</div><b>${p.duration} days</b></div>
      <div class="card" style="padding:12px"><div class="text-sm text-mute">Est. budget</div><b class="mono">${fmtMoney(p.budget)}</b></div>
    </div>
    <div class="text-sm text-mute" style="margin-bottom:6px;font-weight:700">Sample activities</div>
    ${activitiesFor(d.city).slice(0,4).map(a=>`<div class="flex justify-between text-sm" style="padding:6px 0;border-top:1px solid var(--line-soft)"><span>${a.name}</span><span class="mono">${fmtMoney(a.cost)}</span></div>`).join('')}
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="copyCommunityTrip('${p.id}')">${icon('copy')} Copy this trip</button>
  `, {width:480});
}
function copyCommunityTrip(id){
  const p = STATE.community.find(x=>x.id===id);
  const trip = makeTrip({ name:p.title, status:'draft', budgetTotal:p.budget, interests:[p.tag],
    startDate: addDays(new Date(),25), endDate: addDays(new Date(),25+p.duration), cover:p.cover,
    cities:[ sampleCityStop(p.destId, addDays(new Date(),25), addDays(new Date(),25+p.duration), 3) ] });
  STATE.trips.unshift(trip);
  closeModal();
  toast('Trip copied to your account — find it in Drafts.','success');
  nav('#/trips');
}

/* ================= PROFILE / SETTINGS ================= */

function setProfileTab(t){ profileTab=t; render(); }

  <div class="page">
    <div class="card" style="padding:26px 28px;margin-bottom:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap">

      <div style="flex:1;min-width:200px">
        <div style="font-weight:800;font-size:19px">${u.name}</div>
        <div class="text-sm text-mute">${u.email}</div>
        <div class="text-sm text-mute">${u.city}, ${u.country}</div>

    </div>
    <div class="tabs">${tabs.map(([k,label])=>`<div class="tab ${profileTab===k?'active':''}" onclick="setProfileTab('${k}')">${label}</div>`).join('')}</div>

      <div class="card" style="padding:24px;max-width:560px">
        <div class="grid grid-2">
          <div class="field"><label>First name</label><input class="input" value="${u.name.split(' ')[0]}" onchange="updateProfileName(0,this.value)"></div>
          <div class="field"><label>Last name</label><input class="input" value="${u.name.split(' ').slice(1).join(' ')}" onchange="updateProfileName(1,this.value)"></div>
        </div>
        <div class="field"><label>Email</label><input class="input" value="${u.email}" onchange="STATE.user.email=this.value"></div>

          <div class="field"><label>Phone</label><input class="input" value="${u.phone}" onchange="STATE.user.phone=this.value"></div>

        </div>
        <div class="field"><label>Country</label><input class="input" value="${u.country}" onchange="STATE.user.country=this.value"></div>

      </div>` : ''}

    ${profileTab==='prefs' ? `
      <div class="card" style="padding:24px;max-width:640px">
        <p class="text-sm text-mute" style="margin-top:0">Select the kinds of trips you love — we use this to recommend destinations and activities.</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px">

    ${profileTab==='saved' ? (
      saved.length ? `<div class="grid grid-4">${saved.map(destCardHtml).join('')}</div>` :
      `<div class="empty-state card"><div class="icon-wrap">${icon('bookmark')}</div><h3>No saved destinations</h3><p>Tap the heart icon on any destination to save it here.</p><button class="btn btn-primary" onclick="nav('#/explore')">${icon('explore')} Explore destinations</button></div>`
    ) : ''}

    ${profileTab==='account' ? `
      <div class="card" style="padding:24px;max-width:520px">
        <div class="field"><label>Language</label><select class="input"><option>English</option><option>हिन्दी</option><option>ગુજરાતી</option></select></div>
        <div class="flex justify-between items-center" style="padding:12px 0;border-top:1px solid var(--line-soft)"><span>Email notifications</span><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--teal-500)"></div>
        <div class="flex justify-between items-center" style="padding:12px 0;border-top:1px solid var(--line-soft)"><span>Trip reminders</span><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--teal-500)"></div>
        <div class="flex justify-between items-center" style="padding:12px 0;border-top:1px solid var(--line-soft)"><span>Make my profile private</span><input type="checkbox" style="width:18px;height:18px;accent-color:var(--teal-500)"></div>
        <div class="flex justify-between items-center" style="padding:12px 0;border-top:1px solid var(--line-soft)">
          <div><span>Admin dashboard access</span><div class="text-sm text-mute">Demo toggle — view the analytics dashboard as an administrator.</div></div>
          <input type="checkbox" ${u.role==='admin'?'checked':''} style="width:18px;height:18px;accent-color:var(--teal-500)" onchange="STATE.user.role=this.checked?'admin':'user';render()">

function updateProfileName(part, val){
  const parts = STATE.user.name.split(' ');
  parts[part] = val;
  STATE.user.name = parts.join(' ');
  render();
}
function toggleUserInterest(p){
  const i = STATE.user.interests.indexOf(p);
  if(i>-1) STATE.user.interests.splice(i,1); else STATE.user.interests.push(p);
  render();
}
function confirmDeleteAccount(){
  openModal('Delete your account?', `
    <p class="text-sm text-mute" style="margin-top:0">This permanently deletes your trips, saved destinations and profile. This can't be undone.</p>
    <div class="flex gap-10" style="margin-top:18px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="closeModal();toast('This is a demo — account not actually deleted.')">Delete anyway</button>
    </div>`, {width:420});
}

/* ================= ADMIN DASHBOARD ================= */
function lineChartSVG(values, color){
  const w=520,h=120,max=Math.max(...values),min=Math.min(...values);
  const pts = values.map((v,i)=>{
    const x = 10+i*((w-20)/(values.length-1));
    const y = 100-((v-min)/Math.max(1,(max-min)))*80;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `M${pts[0]} L${pts.join(' L')} L${w-10},110 L10,110 Z`;
  return `<svg width="100%" height="120" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet">
    <path d="${area}" fill="${color}22"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="${color}"/>`).join('')}
  </svg>`;
}
function hBarSVG(items,color){
  const max = Math.max(...items.map(i=>i.v));
  return items.map(i=>`
    <div style="margin-bottom:9px">
      <div class="flex justify-between text-sm" style="margin-bottom:3px"><span>${i.k}</span><span class="mono" style="font-weight:700">${i.v}</span></div>
      <div style="height:8px;border-radius:5px;background:var(--line-soft);overflow:hidden"><div style="height:100%;width:${(i.v/max*100).toFixed(0)}%;background:${color};border-radius:5px"></div></div>
    </div>`).join('');
}
function renderAdmin(){
  if(STATE.user.role!=='admin'){
    return `<div class="page"><div class="empty-state card"><div class="icon-wrap">${icon('admin')}</div><h3>Admin access required</h3><p>Enable admin dashboard access from Profile → Account Settings to view this page.</p><button class="btn btn-primary" onclick="nav('#/profile')">Go to Profile</button></div></div>`;

  const activeUsers = Math.round(totalUsers*0.68);
  const totalTrips = STATE.trips.length*97 + 340;
  const completedTrips = Math.round(totalTrips*0.31);
  const popularCities = [...DESTINATIONS].sort((a,b)=>b.popularity-a.popularity).slice(0,6).map(d=>({k:d.city,v:d.popularity}));
  const popularActs = [{k:'City sightseeing',v:412},{k:'Local food crawl',v:388},{k:'Beach day',v:301},{k:'Palace & fort tour',v:276},{k:'Sunset boat ride',v:210}];
  const tripsOverTime = [22,31,28,40,52,49,63,71,66,80,88,95];
  const userGrowth = [900,940,970,1010,1055,1090,1120,1150,1170,1195,1220,1240];
  const avgBudget = Math.round(STATE.trips.reduce((s,t)=>s+t.budgetTotal,0)/STATE.trips.length);

  return `
  <div class="page">
    <div class="page-head"><div><span class="eyebrow">Admin</span><h1>Admin Dashboard</h1><p>Platform-wide analytics and management.</p></div></div>
    <div class="grid grid-4">
      <div class="card stat-card"><div class="label">${icon('users')} Total Users</div><div class="value">${totalUsers.toLocaleString('en-IN')}</div><div class="delta up">+4.2% this month</div></div>
      <div class="card stat-card"><div class="label">${icon('trips')} Total Trips</div><div class="value">${totalTrips.toLocaleString('en-IN')}</div><div class="delta up">+6.8% this month</div></div>
      <div class="card stat-card"><div class="label">Active Users</div><div class="value">${activeUsers.toLocaleString('en-IN')}</div><div class="delta up">54.8% of total</div></div>
      <div class="card stat-card"><div class="label">Completed Trips</div><div class="value">${completedTrips.toLocaleString('en-IN')}</div><div class="delta up">31% completion</div></div>
      <div class="card stat-card"><div class="label">Popular Destination</div><div class="value" style="font-size:20px">${popularCities[0].k}</div><div class="delta up">★ ${(popularCities[0].v/20).toFixed(1)} rating</div></div>
      <div class="card stat-card"><div class="label">Avg. Trip Budget</div><div class="value">${fmtMoney(avgBudget)}</div><div class="delta up">Across active trips</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:22px">
      <div class="card" style="padding:20px"><h3 style="margin-top:0">Trips created over time</h3>${lineChartSVG(tripsOverTime,'#2ba7a8')}</div>
      <div class="card" style="padding:20px"><h3 style="margin-top:0">User growth</h3>${lineChartSVG(userGrowth,'#ff8a5c')}</div>
    </div>
    <div class="grid grid-2" style="margin-top:20px">
      <div class="card" style="padding:20px"><h3 style="margin-top:0">Popular cities</h3>${hBarSVG(popularCities,'#124a63')}</div>
      <div class="card" style="padding:20px"><h3 style="margin-top:0">Popular activities</h3>${hBarSVG(popularActs,'#17667f')}</div>
    </div>

    <div class="section-head"><h2>Users</h2></div>
    <div class="card" style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13.5px">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--line)">
          ${['Name','Email','Joined','Trips','Status','Actions'].map(h=>`<th style="padding:12px 16px;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em">${h}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${USERS_ADMIN.map((u,i)=>`
          <tr style="border-bottom:1px solid var(--line-soft)">
            <td style="padding:11px 16px;font-weight:700">${u.name}</td>
            <td style="padding:11px 16px;color:var(--ink-soft)">${u.email}</td>
            <td style="padding:11px 16px" class="mono">${fmtDate(u.joined)}</td>
            <td style="padding:11px 16px">${u.trips}</td>
            <td style="padding:11px 16px"><span class="badge ${u.status==='Active'?'badge-success':'badge-warn'}">${u.status}</span></td>
            <td style="padding:11px 16px">
              <div class="flex gap-6">
                <button class="btn btn-ghost btn-sm" onclick="toast('Viewing ${u.name}\\'s profile (demo).')">View</button>
                <button class="btn btn-ghost btn-sm" onclick="toggleAdminUserStatus(${i})">${u.status==='Active'?'Disable':'Enable'}</button>
                <button class="btn btn-danger btn-sm" onclick="toast('User removal disabled in demo.','error')">${icon('trash')}</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="grid grid-2" style="margin-top:24px">
      <div>
        <div class="section-head" style="margin-top:0"><h2>Popular Destinations</h2></div>
        <div class="card" style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13.5px">
            <thead><tr style="border-bottom:1px solid var(--line)">${['City','Country','Trips','Popularity'].map(h=>`<th style="padding:10px 14px;text-align:left;color:var(--ink-soft);font-size:11px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead>
            <tbody>${popularCities.map(c=>{const d=DESTINATIONS.find(x=>x.city===c.k);return `<tr style="border-bottom:1px solid var(--line-soft)"><td style="padding:9px 14px;font-weight:700">${c.k}</td><td style="padding:9px 14px;color:var(--ink-soft)">${d.country}</td><td style="padding:9px 14px">${20+c.v}</td><td style="padding:9px 14px">${c.v}%</td></tr>`;}).join('')}</tbody>
          </table>
        </div>
      </div>
      <div>
        <div class="section-head" style="margin-top:0"><h2>Popular Activities</h2></div>
        <div class="card" style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13.5px">
            <thead><tr style="border-bottom:1px solid var(--line)">${['Activity','Category','Times Added'].map(h=>`<th style="padding:10px 14px;text-align:left;color:var(--ink-soft);font-size:11px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead>
            <tbody>${popularActs.map(a=>`<tr style="border-bottom:1px solid var(--line-soft)"><td style="padding:9px 14px;font-weight:700">${a.k}</td><td style="padding:9px 14px;color:var(--ink-soft)">${ACTIVITY_TEMPLATES.find(t=>t.name===a.k)?.cat||'—'}</td><td style="padding:9px 14px">${a.v}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}
function toggleAdminUserStatus(i){
  USERS_ADMIN[i].status = USERS_ADMIN[i].status==='Active'?'Disabled':'Active';
  toast('User status updated.','success');
  render();
}

/* ================= PUBLIC SHARED ITINERARY ================= */
function renderPublicTrip(tripId){
  const trip = getTrip(tripId);
  if(!trip || !trip.isPublic){
    return `<div class="page" style="max-width:600px;margin:60px auto"><div class="empty-state card"><div class="icon-wrap">${icon('map')}</div><h3>This itinerary isn't public</h3><p>The trip may have been made private or removed by its owner.</p><a class="btn btn-primary" href="#/login">Go to GlobeNest</a></div></div>`;
  }
  const totalCost = trip.cities.reduce((s,c)=>s+stopCost(c),0);
  return `
  <div style="min-height:100vh;background:var(--mist-50)">
    <div class="topbar" style="justify-content:space-between">
      <div class="sidebar-logo" style="padding:0"><div class="mark">GN</div><div class="word">GlobeNest</div></div>
      <a class="btn btn-primary btn-sm" href="#/login">Log in to plan your own</a>
    </div>
    <div style="max-width:900px;margin:0 auto;padding:32px 24px 80px">
      <div style="position:relative;height:260px;border-radius:22px;overflow:hidden;margin-bottom:24px">
        <img src="${trip.cover}" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,27,38,0) 40%,rgba(7,27,38,.7));"></div>
        <div style="position:absolute;bottom:20px;left:24px;color:#fff">
          <div class="eyebrow" style="color:var(--teal-300)">Shared by ${STATE.user.name}</div>
          <h1 style="margin:4px 0 0;font-size:30px;font-weight:800">${trip.name}</h1>
        </div>
      </div>
      <div class="grid grid-4" style="margin-bottom:26px">
        <div class="card stat-card" style="padding:16px"><div class="label">Dates</div><div class="value" style="font-size:15px">${fmtDate(trip.startDate)} – ${fmtDate(trip.endDate)}</div></div>
        <div class="card stat-card" style="padding:16px"><div class="label">Cities</div><div class="value" style="font-size:15px">${trip.cities.map(c=>c.city).join(', ')}</div></div>
        <div class="card stat-card" style="padding:16px"><div class="label">Duration</div><div class="value" style="font-size:15px">${daysBetween(trip.startDate,trip.endDate)} days</div></div>
        <div class="card stat-card" style="padding:16px"><div class="label">Total est. cost</div><div class="value" style="font-size:15px">${fmtMoney(totalCost)}</div></div>
      </div>
      <h2 style="font-size:19px;font-weight:800">Day-by-day itinerary</h2>
      ${trip.cities.map(c=>`
        <div class="card" style="padding:18px;margin-bottom:14px">
          <div class="flex gap-14 items-center" style="margin-bottom:12px">
            <img src="${c.image}" style="width:56px;height:56px;border-radius:12px;object-fit:cover">
            <div><div style="font-weight:800;font-size:16px">${c.city}, ${c.country}</div><div class="text-sm text-mute mono">${fmtDate(c.arrival)} → ${fmtDate(c.departure)}</div></div>
          </div>
          ${c.activities.map(a=>`<div class="flex justify-between text-sm" style="padding:7px 0;border-top:1px solid var(--line-soft)"><span class="mono" style="width:52px;color:var(--ocean-600);font-weight:700">${a.time}</span><span style="flex:1">${a.name}</span><span class="mono">${fmtMoney(a.cost)}</span></div>`).join('')}
        </div>`).join('')}
      <div class="flex gap-12" style="margin-top:20px">
        <button class="btn btn-primary btn-lg" onclick="publicCopyTrip('${trip.id}')">${icon('copy')} Copy This Trip</button>
        <button class="btn btn-ghost btn-lg" onclick="toast('Link copied to clipboard.','success')">${icon('share')} Share</button>
      </div>
    </div>
  </div>`;
}
function publicCopyTrip(tripId){
  if(!STATE.authed){ toast('Log in to copy this trip to your account.'); nav('#/login'); return; }
  const t = getTrip(tripId);
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = uid('trip'); copy.name = t.name+' (Copied)'; copy.status='draft'; copy.isPublic=false;
  STATE.trips.unshift(copy);
  toast('Trip copied to your account.','success');
  nav('#/trips');
}

/* ================= INIT ================= */
render();
</script>
